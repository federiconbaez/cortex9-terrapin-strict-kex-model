name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Regenerate results and compare with committed artifacts
        run: |
          cargo run --locked --release --bin terrapin-model -- matrix fixtures/scenarios fixtures/sweep /tmp/results
          diff -r results /tmp/results
          cd results && sha256sum -c SHA256SUMS
